spring.application.name=Insurance

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=insurance
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
jwt.secret=InsurTechInsurancePolicyManagementSystemSecretKey2026SuperSecureKey256BitMinimum
jwt.expiration-ms=86400000

# Admin emails (comma-separated, fixed admin accounts)
app.admin.emails=dungphdse@gmail.com,admin@insurtech.vn

# Google OAuth2 Credentials (Cấu hình qua biến môi trường hoặc thay bằng credentials của bạn)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID_HERE}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET_HERE}
spring.security.oauth2.client.registration.google.scope=email,profile

# File upload for Excel
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.dungphd.insurance=DEBUG
# Renewal reminder (tính năng tái tục) - mặc định TẮT vì chưa có cấu hình mail thật
app.renewal.reminder-enabled=false
app.renewal.reminder-days=30
app.renewal.reminder-cron=0 0 8 * * *
